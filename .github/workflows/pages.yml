name: Publish golf calendar feeds

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build subscription feeds
        run: node scripts/build.mjs --base-url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
      - name: Validate subscription feeds
        run: node scripts/validate.mjs
      - name: Test calendar updates
        run: node scripts/test-timed.mjs && node scripts/test-subscription.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
